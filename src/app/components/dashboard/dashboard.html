<!-- ================= HEADER ================= -->
<nav class="navbar board-navbar">
  <div class="container-fluid navbar-content">

    <!-- Left: Logo Section -->
    <a class="brand-section" href="#">

      <div class="brand-details">
        <span class="brand-name">Jira Board</span>
      </div>
    </a>

    <!-- Right: Actions Section -->
    <div class="header-actions">

      <button
        type="button"
        class="btn btn btn-light add-list-btn"
        (click)="openAddListModal()"
      >
        <i class="bi bi-plus-lg"></i>
        <span>Add List</span>
      </button>

      <div class="profile-section">
        <div class="avatar">AK</div>
      </div>

    </div>
  </div>
</nav>

<!-- ================= BOARD CONTENT ================= -->
<main class="dashboard-container">

  <!-- Board Lists -->
  <div class="board" cdkDropListGroup>

    @for (list of lists; track list.id) {
      <app-board-list 
        [list] = "list"
        (deleteList) = "deleteList($event)"
        (cardDropped) = "drop($event, list)"
      />
    }

  </div>
</main>


<!-- ================= ADD LIST MODAL ================= -->
@if (showAddListModal) {
  <app-add-list-modal
    (save)="saveNewList($event)"
    (cancel)="closeAddListModal()"
  />
}
